name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Restore signing key from secrets (optional)
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.BIKE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bike.jks"
            echo "BIKE_KEYSTORE=$RUNNER_TEMP/bike.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret BIKE_KEYSTORE_BASE64 belum diisi, APK memakai debug key sementara (update perlu uninstall dulu)."
          fi

      - name: Unit test
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: Build APK
        env:
          BIKE_KEYSTORE_PASSWORD: ${{ secrets.BIKE_KEYSTORE_PASSWORD }}
          BIKE_KEY_ALIAS: ${{ secrets.BIKE_KEY_ALIAS }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BikeJackReader.apk

      - uses: actions/upload-artifact@v7
        with:
          name: BikeJackReader-apk
          path: BikeJackReader.apk
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/bike.jks"

  release:
    # Push tag v* (misal v1.0) -> APK dilampirkan ke GitHub Release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: BikeJackReader-apk
      - uses: softprops/action-gh-release@v3
        with:
          files: BikeJackReader.apk
