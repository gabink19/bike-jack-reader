plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gibran.bikereader'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gibran.bikereader'
        minSdk 26
        targetSdk 34
        // Nomor build GitHub Actions dipakai sebagai versionCode agar tiap build bisa di-install sebagai update.
        def runNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
        versionCode runNumber
        // Build dari tag (misal v0.1) memakai nama tag tanpa "v"; build biasa diberi akhiran -dev.
        def tagName = System.getenv('GITHUB_REF_TYPE') == 'tag' ? System.getenv('GITHUB_REF_NAME') : null
        versionName tagName ? tagName.replaceFirst('^v', '') : "0.1-dev.${runNumber}"
    }

    // Kunci tanda tangan dibaca dari environment (GitHub Secrets), tidak pernah disimpan di repo.
    // Tanpa BIKE_KEYSTORE, APK ditandatangani dengan debug keystore bawaan runner
    // (berubah tiap build, jadi update perlu uninstall dulu).
    def releaseKeystore = System.getenv('BIKE_KEYSTORE')
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('BIKE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('BIKE_KEY_ALIAS') ?: 'bike'
                keyPassword System.getenv('BIKE_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
